<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="czytella">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>czytella</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Pre-loader displayed while Flutter initializes -->
  <div id="loading" style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color:#FAFAF7; color:#1E5128;">
    <div style="font-size:36px; font-weight:bold; margin-bottom:8px; display:flex; align-items:center; gap:8px;">
      <span>📖</span><span>Czytella</span>
    </div>
    <div style="font-size:14px; color:#555; margin-bottom:28px; font-weight:500;">Lokalna społeczność czytelników i wymiany książek</div>
    <div style="width:38px; height:38px; border:3px solid #D6E8D5; border-top:3px solid #1E5128; border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      body { margin: 0; padding: 0; background-color: #FAFAF7; }
    </style>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
