name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (np. v1.0.4)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d ' \r\n')
          echo "Detected version: $VERSION"
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare APK artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.get_version.outputs.TAG }}"
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/Czytella.apk
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/Czytella-${TAG}.apk"

      - name: Create or Update GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Czytella Mobile ${{ steps.get_version.outputs.TAG }} (Android APK)
          body: |
            ## 📱 Oficjalna aplikacja mobilna Czytella na system Android

            Pobierz i zainstaluj najnowszą wersję `.apk` bezpośrednio na telefonie:
            - **[Czytella.apk](https://github.com/aucikkosmonaucik-boop/czytella/releases/latest/download/Czytella.apk)**

            ### 🚀 Funkcje aplikacji:
            - 📸 **Skaner kodów ISBN aparatem** – automatyczne rozpoznawanie kodów i okładek z bazy Biblioteki Narodowej
            - 📍 **Lokalna społeczność** – wymiana i sprzedaż książek w promieniu 5 km
            - 💬 **Wbudowany czat** – bezpieczne umawianie wymian bez podawania numeru telefonu
            - 📚 **Moja Półka** – organizacja domowej biblioteki i lista życzeń („Szukam”)
            - 🔔 **Inteligentne powiadomienia** – gdy ktoś w okolicy wystawi książkę z Twojej listy
          files: |
            release-artifacts/Czytella.apk
            release-artifacts/Czytella-${{ steps.get_version.outputs.TAG }}.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
